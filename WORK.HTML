<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Car App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
body {
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  transition: 0.5s;
}

.dark-mode {
  background: #111 !important;
}

.card {
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  color: white;
}

.car-img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 15px;
}

button:hover {
  transform: scale(1.05);
}

#suggestions {
  background: white;
  color: black;
  border-radius: 10px;
  position: absolute;
  width: 100%;
  z-index: 10;
}

.suggestion-item {
  padding: 8px;
  cursor: pointer;
}

.suggestion-item:hover {
  background: #eee;
}
</style>
</head>

<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card p-4 text-center" style="max-width:420px;" data-aos="zoom-in">

    <button class="btn btn-warning mb-2" onclick="toggleMode()">🌙 Toggle Mode</button>

    <img id="carImage" class="car-img mb-2" src="https://images.unsplash.com/photo-1503376780353-7e6692767b70">

    <h3>🚗 Car Finder</h3>

    <div style="position:relative;">
      <input type="text" id="carInput" class="form-control" placeholder="Search car" onkeyup="showSuggestions()">
      <div id="suggestions"></div>
    </div>

    <button class="btn btn-info mt-3 w-100" onclick="checkCar()">Check</button>

    <button class="btn btn-success mt-2 w-100" onclick="saveCar()">Save Car</button>

    <div id="result" class="mt-3 fw-bold"></div>

  </div>
</div>

<audio id="clickSound" src="https://www.fesliyanstudios.com/play-mp3/387"></audio>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init();

var cars = [
  { name: "Toyota", img: "https://images.unsplash.com/photo-1549924231-f129b911e442" },
  { name: "Honda", img: "https://images.unsplash.com/photo-1511918984145-48de785d4c1c" },
  { name: "BMW", img: "https://images.unsplash.com/photo-1502877338535-766e1452684a" },
  { name: "Tesla", img: "https://images.unsplash.com/photo-1511396275273-4e0e8c8f8c71" },
  { name: "Ford", img: "https://images.unsplash.com/photo-1494976388531-d1058494cdd8" },
  { name: "Audi", img: "https://images.unsplash.com/photo-1503736334956-4c8f8e92946d" },
  { name: "lamborghini", img: " https://images.unsplash.com/photo-1612825173281-9a193378527e?q=80&w=799&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"},
  { name: "mercendies" , img: "https://images.unsplash.com/photo-1622551997608-400d763b0f64?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"},
  { name: "mehran" , img: "https://images.unsplash.com/photo-1597687210367-a4915552d886?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"},
  { name: " Porsche", img: "https://images.unsplash.com/photo-1580274455191-1c62238fa333?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"}

];

function playSound() {
  document.getElementById("clickSound").play();
}

function checkCar() {
  playSound();
  var input = carInput.value.toLowerCase();
  var result = document.getElementById("result");
  var image = document.getElementById("carImage");

  var found = cars.find(c => c.name.toLowerCase() === input);

  if (found) {
    result.innerHTML = "✅ Available";
    result.style.color = "lightgreen";
    image.src = found.img;
  } else {
    result.innerHTML = "❌ Not Available";
    result.style.color = "red";
  }
}

function showSuggestions() {
  var input = carInput.value.toLowerCase();
  var box = document.getElementById("suggestions");
  box.innerHTML = "";

  cars.filter(c => c.name.toLowerCase().includes(input)).forEach(c => {
    var div = document.createElement("div");
    div.innerText = c.name;
    div.className = "suggestion-item";
    div.onclick = () => {
      carInput.value = c.name;
      box.innerHTML = "";
    };
    box.appendChild(div);
  });
}

function saveCar() {
  var car = carInput.value;
  if (!car) return;

  localStorage.setItem("savedCar", car);
  alert("Saved: " + car);
}

function toggleMode() {
  document.body.classList.toggle("dark-mode");
}

window.onload = function() {
  var saved = localStorage.getItem("savedCar");
  if (saved) {
    carInput.value = saved;
  }
};
</script>

</body>
</html>
